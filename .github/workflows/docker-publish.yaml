name: Build and Publish Container

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API image
        run: |
          cd zein.finance.api
          docker build -t ghcr.io/${{ github.repository_owner }}/financehubapi:latest .
      
      - name: Push API image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/financehubapi:latest

      - name: Build Web image
        run: |
          cd zein.finance.web
          docker build -t ghcr.io/${{ github.repository_owner }}/financehubweb:latest --build-arg API_URL=https://financehub-api.orangehill-3109abae.germanywestcentral.azurecontainerapps.io  .

      - name: Push Web image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/financehubweb:latest